version: 2.1

# ---------------------------------------------------------------------------
# Orbs - reusable CircleCI packages
# ---------------------------------------------------------------------------
orbs:
  docker: circleci/docker@2.7.1
  snyk: snyk/snyk@2.2.0

# ---------------------------------------------------------------------------
# Parameters
# ---------------------------------------------------------------------------
parameters:
  image-name:
    type: string
    default: "juwondre/gitops-nginx"

# ---------------------------------------------------------------------------
# Executors
# ---------------------------------------------------------------------------
executors:
  default:
    docker:
      - image: cimg/base:2024.09
    resource_class: medium

# ---------------------------------------------------------------------------
# Commands - reusable step sequences
# ---------------------------------------------------------------------------
commands:
  install-k8s-tools:
    description: Install Kubernetes validation tools
    steps:
      - run:
          name: Install kubeconform
          command: |
            KUBECONFORM_VERSION="v0.6.6"
            curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
              | sudo tar xz -C /usr/local/bin kubeconform
            sudo chmod +x /usr/local/bin/kubeconform

      - run:
          name: Install helm
          command: |
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | sudo bash

  compute-image-tag:
    description: Compute Docker image tag based on branch
    steps:
      - run:
          name: Compute image tag
          command: |
            SHORT_SHA=$(echo "$CIRCLE_SHA1" | cut -c1-7)
            BRANCH="$CIRCLE_BRANCH"

            if [ "$BRANCH" = "main" ] || [ "$BRANCH" = "master" ]; then
              TAG="latest"
              EXTRA_TAG="v1.0.0-${SHORT_SHA}"
            elif [ "$BRANCH" = "develop" ]; then
              TAG="develop-${SHORT_SHA}"
              EXTRA_TAG=""
            elif echo "$BRANCH" | grep -q "^release/"; then
              VERSION=$(echo "$BRANCH" | sed 's|release/||')
              TAG="rc-${VERSION}-${SHORT_SHA}"
              EXTRA_TAG=""
            elif echo "$BRANCH" | grep -q "^hotfix/"; then
              TAG="hotfix-${SHORT_SHA}"
              EXTRA_TAG=""
            else
              TAG="feature-${SHORT_SHA}"
              EXTRA_TAG=""
            fi

            echo "export IMAGE_TAG=${TAG}" >> "$BASH_ENV"
            echo "export EXTRA_TAG=${EXTRA_TAG}" >> "$BASH_ENV"
            echo "Image tag: ${TAG}"

# ---------------------------------------------------------------------------
# Jobs
# ---------------------------------------------------------------------------
jobs:
  # ---- Validate: lint Dockerfile, K8s manifests, Helm charts ----
  validate:
    executor: default
    steps:
      - checkout
      - install-k8s-tools

      - run:
          name: Lint Dockerfile (hadolint)
          command: |
            sudo curl -sSL https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64 \
              -o /usr/local/bin/hadolint
            sudo chmod +x /usr/local/bin/hadolint
            hadolint Dockerfile --failure-threshold warning || true
            hadolint Dockerfile --failure-threshold error

      - run:
          name: Validate K8s manifests (kubeconform)
          command: |
            kubeconform -strict -summary \
              nginx-deployment/nginx.yaml

      - run:
          name: Helm lint
          command: |
            helm lint charts/helm/ || echo "Note: charts/helm is a raw manifest, not a full Helm chart — skipping helm lint"

      - run:
          name: YAML lint
          command: |
            sudo apt-get update -qq
            sudo apt-get install -y yamllint
            yamllint -d "{extends: relaxed, rules: {line-length: {max: 200}}}" \
              nginx-deployment/ charts/helm/ nginx/

  # ---- Build Docker image ----
  build-image:
    executor: default
    steps:
      - checkout
      - setup_remote_docker:
          docker_layer_caching: true
      - compute-image-tag

      - run:
          name: Build Docker image
          command: |
            docker build \
              --label "org.opencontainers.image.revision=${CIRCLE_SHA1}" \
              --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              -t << pipeline.parameters.image-name >>:${IMAGE_TAG} \
              .

      - run:
          name: Save image to workspace
          command: |
            mkdir -p /tmp/docker-images
            docker save -o /tmp/docker-images/image.tar << pipeline.parameters.image-name >>:${IMAGE_TAG}

      - persist_to_workspace:
          root: /tmp
          paths:
            - docker-images

  # ---- Security scan with Trivy ----
  scan-trivy:
    executor: default
    steps:
      - checkout
      - setup_remote_docker
      - attach_workspace:
          at: /tmp
      - compute-image-tag

      - run:
          name: Install Trivy
          command: |
            TRIVY_VERSION="0.54.1"
            curl -sSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
              | sudo tar xz -C /usr/local/bin trivy
            sudo chmod +x /usr/local/bin/trivy

      - run:
          name: Load Docker image
          command: |
            docker load -i /tmp/docker-images/image.tar

      - run:
          name: Trivy image scan (table)
          command: |
            trivy image \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              --format table \
              << pipeline.parameters.image-name >>:${IMAGE_TAG}

      - run:
          name: Trivy image scan (JSON report)
          command: |
            mkdir -p /tmp/scan-results
            trivy image \
              --severity HIGH,CRITICAL \
              --format json \
              --output /tmp/scan-results/trivy-report.json \
              << pipeline.parameters.image-name >>:${IMAGE_TAG}

      - run:
          name: Trivy image scan (fail on CRITICAL)
          command: |
            trivy image \
              --severity CRITICAL \
              --exit-code 1 \
              --ignorefile .trivyignore \
              << pipeline.parameters.image-name >>:${IMAGE_TAG}

      - run:
          name: Trivy config scan (K8s manifests)
          command: |
            trivy config \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              nginx-deployment/ charts/helm/

      - store_artifacts:
          path: /tmp/scan-results
          destination: trivy-reports

  # ---- Security scan with Snyk ----
  scan-snyk:
    executor: default
    steps:
      - checkout
      - setup_remote_docker
      - attach_workspace:
          at: /tmp
      - compute-image-tag

      - run:
          name: Load Docker image
          command: |
            docker load -i /tmp/docker-images/image.tar

      - run:
          name: Install Snyk CLI
          command: |
            sudo curl -sSL https://static.snyk.io/cli/latest/snyk-linux -o /usr/local/bin/snyk
            sudo chmod +x /usr/local/bin/snyk

      - run:
          name: Snyk container test
          command: |
            mkdir -p /tmp/scan-results
            snyk container test \
              << pipeline.parameters.image-name >>:${IMAGE_TAG} \
              --file=Dockerfile \
              --severity-threshold=high \
              --json-file-output=/tmp/scan-results/snyk-report.json || true

      - run:
          name: Snyk IaC test (K8s manifests)
          command: |
            snyk iac test \
              nginx-deployment/nginx.yaml \
              --severity-threshold=high || true

      - store_artifacts:
          path: /tmp/scan-results
          destination: snyk-reports

  # ---- Push image to Docker Hub ----
  push-image:
    executor: default
    steps:
      - setup_remote_docker
      - attach_workspace:
          at: /tmp
      - compute-image-tag

      - run:
          name: Load Docker image
          command: |
            docker load -i /tmp/docker-images/image.tar

      - run:
          name: Login to Docker Hub
          command: |
            echo "$DOCKERHUB_PASSWORD" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - run:
          name: Push image
          command: |
            docker push << pipeline.parameters.image-name >>:${IMAGE_TAG}

            if [ -n "${EXTRA_TAG}" ]; then
              docker tag \
                << pipeline.parameters.image-name >>:${IMAGE_TAG} \
                << pipeline.parameters.image-name >>:${EXTRA_TAG}
              docker push << pipeline.parameters.image-name >>:${EXTRA_TAG}
            fi

      - run:
          name: Output pushed tags
          command: |
            echo "Pushed: << pipeline.parameters.image-name >>:${IMAGE_TAG}"
            if [ -n "${EXTRA_TAG}" ]; then
              echo "Pushed: << pipeline.parameters.image-name >>:${EXTRA_TAG}"
            fi

  # ---- Update K8s manifests with new image tag ----
  update-manifests:
    executor: default
    steps:
      - checkout
      - compute-image-tag

      - run:
          name: Update image tags in manifests
          command: |
            FULL_IMAGE="<< pipeline.parameters.image-name >>:${IMAGE_TAG}"

            # Update nginx-deployment manifest
            sed -i "s|image: .*nginx.*|image: ${FULL_IMAGE}|g" \
              nginx-deployment/nginx.yaml

            # Update helm chart manifest
            sed -i "s|image: .*nginx.*|image: ${FULL_IMAGE}|g" \
              charts/helm/deployment.yaml

            echo "Updated manifests to use: ${FULL_IMAGE}"
            echo "--- nginx-deployment/nginx.yaml ---"
            cat nginx-deployment/nginx.yaml
            echo "--- charts/helm/deployment.yaml ---"
            cat charts/helm/deployment.yaml

      - run:
          name: Commit and push manifest updates
          command: |
            git config user.email "ci@circleci.com"
            git config user.name "CircleCI"
            git add nginx-deployment/nginx.yaml charts/helm/deployment.yaml
            git diff --cached --quiet && echo "No changes to commit" && exit 0
            git commit -m "ci: update image tag to ${IMAGE_TAG} [skip ci]"
            git push origin "${CIRCLE_BRANCH}"

# ---------------------------------------------------------------------------
# Workflows
# ---------------------------------------------------------------------------
workflows:
  version: 2

  build-test-deploy:
    jobs:
      # --- Validate runs on ALL branches ---
      - validate

      # --- Build runs on integration branches only ---
      - build-image:
          requires:
            - validate
          filters:
            branches:
              only:
                - develop
                - main
                - master
                - /^release\/.*/
                - /^hotfix\/.*/

      # --- Security scans run in parallel after build ---
      - scan-trivy:
          requires:
            - build-image

      - scan-snyk:
          requires:
            - build-image
          context:
            - snyk-credentials

      # --- Push image after scans pass ---
      - push-image:
          requires:
            - scan-trivy
            - scan-snyk
          context:
            - docker-credentials

      # --- Update manifests for release and hotfix branches ---
      - update-manifests:
          requires:
            - push-image
          filters:
            branches:
              only:
                - develop
                - /^release\/.*/
                - /^hotfix\/.*/

      # --- Manual approval gate for production ---
      - hold-prod-deploy:
          type: approval
          requires:
            - push-image
          filters:
            branches:
              only:
                - main
                - master

      # --- Update manifests for production after approval ---
      - update-manifests:
          name: update-manifests-prod
          requires:
            - hold-prod-deploy
          filters:
            branches:
              only:
                - main
                - master

  # --- Nightly security scan on default branch ---
  nightly-security-scan:
    triggers:
      - schedule:
          cron: "0 3 * * *"
          filters:
            branches:
              only:
                - main
                - master
    jobs:
      - build-image
      - scan-trivy:
          requires:
            - build-image
      - scan-snyk:
          requires:
            - build-image
          context:
            - snyk-credentials
